def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def modVersion = findProperty('mod_version') ?: '1.0.0'
def useDaemon = Boolean.parseBoolean(String.valueOf(findProperty('useDaemon') ?: 'false'))
def extraArgs = String.valueOf(findProperty('childArgs') ?: '').trim()
def dist = layout.buildDirectory.dir('dist')

def jdkHome = { int major ->
    def value = findProperty("java${major}Home") ?: System.getenv("JAVA${major}_HOME")
    return value ? value.toString() : null
}

subprojects { sub ->
    def loader = sub.name
    def major = gradle.ext.loaders[loader]
    def home = jdkHome(major)

    def delegate = { String taskName, String childTask, String text ->
        sub.tasks.register(taskName, Exec) {
            group = 'orpheus'
            description = text
            workingDir = sub.projectDir
            def command = windows
                    ? ['cmd', '/c', 'gradlew.bat']
                    : ['sh', new File(sub.projectDir, 'gradlew').absolutePath]
            command << childTask
            command << "-Pmod_version=${modVersion}".toString()
            command << "-Pversion=${modVersion}".toString()
            if (!useDaemon) {
                command << '--no-daemon'
            }
            if (gradle.startParameter.offline) {
                command << '--offline'
            }
            if (home) {
                environment 'JAVA_HOME', home
                command << "-Dorg.gradle.java.installations.paths=${home}".toString()
            }
            if (findProperty('dryRun')) {
                command << "-PdryRun=${findProperty('dryRun')}".toString()
            }
            if (extraArgs) {
                command.addAll(extraArgs.split('\\s+') as List)
            }
            commandLine command
        }
    }

    delegate('build', 'build', "Builds the ${loader} jar with Java ${major}")
    delegate('compile', 'compileJava', "Compiles the ${loader} project with Java ${major}")
    delegate('clean', 'clean', "Cleans the ${loader} project")
    delegate('runClient', 'runClient', "Runs the ${loader} client")
    delegate('publishToMavenLocal', 'publishToMavenLocal', "Installs the ${loader} jar into the local Maven repository")
    delegate('publishMods', 'publishMods', "Publishes the ${loader} jar to Modrinth and CurseForge")
    delegate('publishModrinth', 'publishModrinth', "Publishes the ${loader} jar to Modrinth")
    delegate('publishCurseforge', 'publishCurseforge', "Publishes the ${loader} jar to CurseForge")

    sub.tasks.register('collectJar', Copy) {
        group = 'orpheus'
        description = "Copies the ${loader} jar into the root dist directory"
        from(sub.layout.projectDirectory.dir('build/libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar', '*-dev.jar', '*-slim.jar'
        }
        into(dist)
    }

    sub.tasks.named('build') {
        finalizedBy 'collectJar'
    }
}

def every = { String taskName ->
    subprojects.collect { "${it.path}:${taskName}".toString() }
}

tasks.register('build') {
    group = 'orpheus'
    description = 'Builds every loader into build/dist'
    dependsOn every('build')
}

tasks.register('compileAll') {
    group = 'orpheus'
    description = 'Compiles every loader (use with --continue)'
    dependsOn every('compile')
}

tasks.register('clean') {
    group = 'orpheus'
    description = 'Cleans every loader'
    dependsOn every('clean')
}

tasks.register('publishToMavenLocal') {
    group = 'orpheus'
    description = 'Installs every loader jar into the local Maven repository'
    dependsOn every('publishToMavenLocal')
}

['publishMods': 'Modrinth and CurseForge', 'publishModrinth': 'Modrinth', 'publishCurseforge': 'CurseForge'].each { taskName, target ->
    tasks.register(taskName) {
        group = 'orpheus'
        description = "Publishes every loader to ${target} (-PdryRun=true only prints what would be uploaded)"
        dependsOn every(taskName)
    }
}
