plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = findProperty('mod_version') ?: '1.0.0'
group = 'com.github.olympus.orpheus'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'orpheus'

            args '--mixin.config', 'orpheus.mixins.json'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'orpheus', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    mavenLocal()
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation "com.github.olympus.proteus:proteus-forge-26.2-26.3:${project.proteus_version}"
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.5')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': 'orpheus.mixins.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java {
    srcDir '../common/src/main/java'
}

sourceSets.main.resources {
    srcDir '../common/src/main/resources'
}

def forgeModVersion = project.version.toString()

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', forgeModVersion
    filesMatching('META-INF/mods.toml') {
        expand(mod_version: forgeModVersion)
    }
}

ext.orpheusPublish = [
    loader: 'forge',
    label: '26.2-26.3',
    java: 25,
    requires: [],
    jar: { tasks.jar.archiveFile }
]
apply from: '../publish.gradle'
