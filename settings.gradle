rootProject.name = 'Orpheus'

def targets = [
    'Fabric'  : ['1.20.1', '1.20.3', '1.21.1', '1.21.2', '1.21.4', '1.21.6', '1.21.9', '1.21.11', '26.1', '26.2'],
    'Forge'   : ['1.20.1', '1.20.4', '1.20.6', '1.21.1', '1.21.3', '1.21.4', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2'],
    'NeoForge': ['1.20.4', '1.20.6', '1.21.1', '1.21.3', '1.21.4', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2']
]

def javaVersions = [
    '1.20.1' : 17,
    '1.20.3' : 17,
    '1.20.4' : 17,
    '1.20.6' : 21,
    '1.21.1' : 21,
    '1.21.2' : 21,
    '1.21.3' : 21,
    '1.21.4' : 21,
    '1.21.6' : 21,
    '1.21.8' : 21,
    '1.21.9' : 21,
    '1.21.10': 21,
    '1.21.11': 21,
    '26.1'   : 25,
    '26.2'   : 25
]

gradle.ext.targets = targets
gradle.ext.javaVersions = javaVersions

targets.each { loader, versions ->
    versions.each { version ->
        def name = "${loader}-${version}"
        include name
        project(":${name}").buildFileName = 'orpheus-delegate.gradle'
    }
}
