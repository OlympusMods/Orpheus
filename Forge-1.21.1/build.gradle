plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = findProperty('mod_version') ?: '1.0.0'
group = 'com.github.olympus.orpheus'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.enabledGameTestNamespaces', 'orpheus'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'orpheus', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.16')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    add sourceSets.main, 'orpheus.refmap.json'
    config 'orpheus.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

sourceSets.main.java {
    srcDir '../common/core/src/main/java'
    srcDir '../common/client/src/main/java'
    srcDir '../common/mc1_21/src/main/java'
}

sourceSets.main.resources {
    srcDir '../common/resources'
    srcDir '../common/generated/mc1_21'
}

def forgeModVersion = project.version.toString()

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', forgeModVersion
    filesMatching('META-INF/mods.toml') {
        expand(mod_version: forgeModVersion)
    }
}
