plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

repositories {
	mavenLocal()
}

loom {
	mods {
		"orpheus" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs = [
				'src/main/java',
				'../common/core/src/main/java',
				'../common/client/src/main/java',
				'../common/mc26_2/src/main/java'
			]
		}
		resources {
			srcDirs = [
				'src/main/resources',
				'../common/resources',
				'../common/generated/mc26'
			]
		}
	}
}

dependencies {
	implementation "com.github.olympus.proteus:proteus-fabric-26.2-26.3:${project.proteus_version}"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

ext.orpheusPublish = [
	loader: 'fabric',
	label: '26.2-26.3',
	java: 25,
	requires: ['fabric-api'],
	jar: { tasks.jar.archiveFile }
]
apply from: '../publish.gradle'
