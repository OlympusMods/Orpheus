license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"
authors="Akis"
iconFile="icon.png"

description='''
Precise control over vanilla Minecraft music: per-situation track lists, frequency, weights, playback keys and presets.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="proteus"
    type="required"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config = "orpheus.mixins.json"
